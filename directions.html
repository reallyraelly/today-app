<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Today — Directions</title>
<link rel="stylesheet" href="style.css" />
<style>
  .screen { padding-bottom: var(--space-6); }

  .detail-topbar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-5); }
  .back-btn {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-card);
    border-radius: 14px;
    box-shadow: var(--shadow-card);
    border: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .back-btn svg { width: 20px; height: 20px; color: var(--color-text); }
  .detail-topbar h1 { font-family: var(--font-heading); font-weight: 600; font-size: 19px; margin: 0; text-align: left; }

  .map-frame {
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-soft);
    margin-bottom: var(--space-5);
  }
  .map-frame svg { display: block; width: 100%; height: auto; }
  .map-note { font-size: 11px; color: var(--color-text-soft); text-align: center; margin: -12px 0 var(--space-5); }

  .mode-row { display: flex; gap: var(--space-2); margin-bottom: var(--space-5); }
  .mode-card {
    flex: 1;
    background: var(--color-card);
    border: 1.5px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 12px 6px 14px;
    text-align: center;
    cursor: pointer;
    transition: transform 150ms var(--ease-standard), background 200ms var(--ease-standard), border-color 200ms var(--ease-standard);
  }
  .mode-card:active { transform: scale(0.96); }
  .mode-card .mode-icon { font-size: 20px; margin-bottom: 4px; }
  .mode-card .mode-name { font-family: var(--font-heading); font-size: 11.5px; font-weight: 600; color: var(--color-text); margin-bottom: 2px; }
  .mode-card .mode-eta { font-size: 11px; color: var(--color-text-soft); }
  .mode-card.selected { background: var(--color-accent); border-color: var(--color-accent); }
  .mode-card.selected .mode-name, .mode-card.selected .mode-eta { color: var(--color-card); }

  .route-summary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    font-family: var(--font-heading);
    font-size: 15px;
    font-weight: 600;
    color: var(--color-text);
    margin-bottom: var(--space-6);
  }
  .route-summary .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--color-text-soft); }
  .route-summary span.sub { font-family: var(--font-body); font-size: 13px; font-weight: 400; color: var(--color-text-soft); }
</style>
</head>
<body>
  <div class="screen">
    <div class="detail-topbar">
      <button class="back-btn" id="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="dest-title">Directions</h1>
    </div>

    <div class="map-frame">
      <svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="260" fill="#e6ecf5"/>
        <g stroke="#d3dcea" stroke-width="6" fill="none">
          <path d="M-10,60 L410,40"/>
          <path d="M-10,150 L410,170"/>
          <path d="M60,-10 L40,270"/>
          <path d="M300,-10 L330,270"/>
        </g>
        <g fill="#d8e0ee">
          <rect x="90" y="20" width="34" height="26" rx="3"/>
          <rect x="150" y="90" width="28" height="22" rx="3"/>
          <rect x="230" y="30" width="30" height="24" rx="3"/>
          <rect x="260" y="180" width="36" height="28" rx="3"/>
          <rect x="120" y="190" width="26" height="20" rx="3"/>
        </g>
        <path d="M70,190 C130,150 180,190 230,120 C260,80 300,90 320,70" stroke="#6198ff" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="2 10"/>
        <circle cx="70" cy="190" r="9" fill="#37323e"/>
        <circle cx="70" cy="190" r="4" fill="#fefeff"/>
        <path d="M320,50 C331,50 340,59 340,70 C340,85 320,102 320,102 C320,102 300,85 300,70 C300,59 309,50 320,50 Z" fill="#6198ff"/>
        <circle cx="320" cy="69" r="7" fill="#fefeff"/>
      </svg>
    </div>
    <p class="map-note">Map preview — for illustration only</p>

    <div class="mode-row" id="mode-row">
      <button type="button" class="mode-card selected" data-eta="12 min" data-dist="2.3 km">
        <div class="mode-icon">🚶</div>
        <div class="mode-name">Walk</div>
        <div class="mode-eta">12 min</div>
      </button>
      <button type="button" class="mode-card" data-eta="6 min" data-dist="2.3 km">
        <div class="mode-icon">🚗</div>
        <div class="mode-name">Drive</div>
        <div class="mode-eta">6 min</div>
      </button>
      <button type="button" class="mode-card" data-eta="15 min" data-dist="2.3 km">
        <div class="mode-icon">🚌</div>
        <div class="mode-name">Transit</div>
        <div class="mode-eta">15 min</div>
      </button>
      <button type="button" class="mode-card" data-eta="8 min" data-dist="2.3 km">
        <div class="mode-icon">🚴</div>
        <div class="mode-name">Cycle</div>
        <div class="mode-eta">8 min</div>
      </button>
    </div>

    <div class="route-summary">
      <span id="route-eta">12 min</span>
      <span class="dot"></span>
      <span class="sub" id="route-dist">2.3 km</span>
    </div>

    <button class="btn btn-primary btn-block">Start</button>
  </div>

  <script>
    document.getElementById('back-btn').addEventListener('click', () => history.back());

    const stored = sessionStorage.getItem('todayPick');
    if (stored) {
      const pick = JSON.parse(stored);
      document.getElementById('dest-title').textContent = pick.title;
    }

    const modeCards = document.querySelectorAll('.mode-card');
    modeCards.forEach(card => {
      card.addEventListener('click', () => {
        modeCards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        document.getElementById('route-eta').textContent = card.dataset.eta;
        document.getElementById('route-dist').textContent = card.dataset.dist;
      });
    });
  </script>
</body>
</html>
