<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Today — Add a Place</title>
<link rel="stylesheet" href="style.css" />
<style>
  .screen { padding-bottom: var(--space-6); }

  .detail-topbar { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-5); }
  .back-btn {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-card);
    border-radius: 14px;
    box-shadow: var(--shadow-card);
    border: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .back-btn svg { width: 20px; height: 20px; color: var(--color-text); }
  .detail-topbar h1 { font-family: var(--font-heading); font-weight: 600; font-size: 20px; margin: 0; text-align: left; }

  .field-group { margin-bottom: var(--space-5); }
  .field-label { font-family: var(--font-heading); font-size: 13px; font-weight: 600; color: var(--color-text); margin-bottom: 8px; display: block; }

  .field-group input[type="text"],
  .field-group textarea {
    width: 100%;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--color-text);
    background: var(--color-card);
    resize: none;
  }
  .field-group input[type="text"]:focus, .field-group textarea:focus { outline: none; border-color: var(--color-accent); }

  .icon-picker { display: flex; gap: 10px; }
  .icon-option {
    width: 52px; height: 52px;
    border-radius: 16px;
    background: var(--color-card);
    border: 1.5px solid var(--color-border);
    cursor: pointer;
    padding: 6px;
  }
  .icon-option.selected { border-color: var(--color-accent); background: var(--color-accent-soft); }
  .icon-option svg { width: 100%; height: 100%; }

  .chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    background: var(--color-card);
    border: 1px solid var(--color-border);
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text);
    cursor: pointer;
  }
  .chip.selected { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-card); }
</style>
</head>
<body>
  <div class="screen">
    <div class="detail-topbar">
      <button class="back-btn" id="back-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1>Add a Place</h1>
    </div>

    <form id="add-form">
      <div class="field-group">
        <label class="field-label">Icon</label>
        <div class="icon-picker" id="icon-picker">
          <button type="button" class="icon-option selected" data-category="Cafés" data-icon='<path d="M-16,-4 h32 v18 a16,16 0 0 1 -16,16 a16,16 0 0 1 -16,-16 Z" fill="#37323e" transform="translate(50,54)"/><path d="M16,2 h8 a8,8 0 0 1 0,16 h-6" fill="none" stroke="#37323e" stroke-width="4" transform="translate(50,54)"/>'>
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fffbc9"/><path d="M-16,-4 h32 v18 a16,16 0 0 1 -16,16 a16,16 0 0 1 -16,-16 Z" fill="#37323e" transform="translate(50,54)"/><path d="M16,2 h8 a8,8 0 0 1 0,16 h-6" fill="none" stroke="#37323e" stroke-width="4" transform="translate(50,54)"/></svg>
          </button>
          <button type="button" class="icon-option" data-category="Nature" data-icon='<path d="M0,-20 C22,-16 22,14 0,22 C-22,14 -22,-16 0,-20 Z" fill="none" stroke="#37323e" stroke-width="3.5" transform="translate(50,54)"/><path d="M0,-18 L0,20" stroke="#6198ff" stroke-width="2.5" stroke-linecap="round" transform="translate(50,54)"/>'>
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fffbc9"/><path d="M0,-20 C22,-16 22,14 0,22 C-22,14 -22,-16 0,-20 Z" fill="none" stroke="#37323e" stroke-width="3.5" transform="translate(50,54)"/><path d="M0,-18 L0,20" stroke="#6198ff" stroke-width="2.5" stroke-linecap="round" transform="translate(50,54)"/></svg>
          </button>
          <button type="button" class="icon-option" data-category="Museums" data-icon='<path d="M-20,10 L0,-4 L20,10 Z" fill="#37323e" transform="translate(50,54)"/><rect x="30" y="64" width="40" height="6" fill="#37323e"/>'>
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fffbc9"/><path d="M-20,10 L0,-4 L20,10 Z" fill="#37323e" transform="translate(50,54)"/><rect x="30" y="64" width="40" height="6" fill="#37323e"/></svg>
          </button>
          <button type="button" class="icon-option" data-category="Hidden Gems" data-icon='<circle cx="50" cy="54" r="26" fill="none" stroke="#37323e" stroke-width="4"/><circle cx="50" cy="54" r="10" fill="#6198ff"/>'>
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fffbc9"/><circle cx="50" cy="54" r="26" fill="none" stroke="#37323e" stroke-width="4"/><circle cx="50" cy="54" r="10" fill="#6198ff"/></svg>
          </button>
          <button type="button" class="icon-option" data-category="Picnics" data-icon='<path d="M-18,0 L18,0 L13,18 L-13,18 Z" fill="#37323e" transform="translate(50,54)"/><path d="M-9,0 L9,0 L6,-5 L-6,-5 Z" fill="#6198ff" transform="translate(50,54)"/>'>
            <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fffbc9"/><path d="M-18,0 L18,0 L13,18 L-13,18 Z" fill="#37323e" transform="translate(50,54)"/><path d="M-9,0 L9,0 L6,-5 L-6,-5 Z" fill="#6198ff" transform="translate(50,54)"/></svg>
          </button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="place-name">Name</label>
        <input type="text" id="place-name" placeholder="e.g. Tanjong Beach Sunset Spot" required />
      </div>

      <div class="field-group">
        <label class="field-label">Tags</label>
        <div class="chip-grid" id="tag-picker">
          <button type="button" class="chip" data-tag="Free">Free</button>
          <button type="button" class="chip" data-tag="Under $20">Under $20</button>
          <button type="button" class="chip" data-tag="$20–50">$20–50</button>
          <button type="button" class="chip" data-tag="$50+">$50+</button>
          <button type="button" class="chip" data-tag="1 Hour">1 Hour</button>
          <button type="button" class="chip" data-tag="Half Day">Half Day</button>
          <button type="button" class="chip" data-tag="Full Day">Full Day</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="place-notes">Notes</label>
        <textarea id="place-notes" rows="3" placeholder="What makes this place worth coming back to?"></textarea>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Save Place</button>
    </form>
  </div>

  <script>
    document.getElementById('back-btn').addEventListener('click', () => history.back());

    const iconPicker = document.getElementById('icon-picker');
    iconPicker.querySelectorAll('.icon-option').forEach(opt => {
      opt.addEventListener('click', () => {
        iconPicker.querySelectorAll('.icon-option').forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      });
    });

    const tagPicker = document.getElementById('tag-picker');
    tagPicker.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('selected'));
    });

    document.getElementById('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const selectedIcon = iconPicker.querySelector('.icon-option.selected');
      const name = document.getElementById('place-name').value.trim();
      const notes = document.getElementById('place-notes').value.trim();
      const tags = Array.from(tagPicker.querySelectorAll('.chip.selected')).map(c => c.dataset.tag);

      if (!name) return;

      const newPlace = {
        icon: selectedIcon.dataset.icon,
        title: name,
        desc: notes || 'Added by you.',
        tags: tags.length ? tags : ['Custom'],
        category: selectedIcon.dataset.category
      };

      const places = JSON.parse(localStorage.getItem('savedPlaces') || '[]');
      places.unshift(newPlace);
      localStorage.setItem('savedPlaces', JSON.stringify(places));
      window.location.href = 'saved.html';
    });
  </script>
</body>
</html>
