<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Today — Welcome</title>
<link rel="stylesheet" href="style.css" />
<style>
  .screen { padding-top: var(--space-5); }
  .progress-dots { margin-bottom: 0; }
  .content-center { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .illustration { height: 240px; margin-bottom: var(--space-4); position: relative; }
  .illustration-svg { position: absolute; inset: 0; overflow: visible; }
  .btn-wrap { margin-top: var(--space-7); }
  .get-started-btn { width: 100%; opacity: 0; animation: btn-in 500ms ease-out 500ms forwards; }
  @keyframes btn-in { to { opacity: 1; } }

  .delay-0 { animation-delay: 0ms; }
  .delay-200 { animation-delay: 200ms; }
  .delay-400 { animation-delay: 400ms; }
  .delay-600 { animation-delay: 600ms; }
  .delay-800 { animation-delay: 800ms; }
  .delay-1000 { animation-delay: 1000ms; }
  .delay-1200 { animation-delay: 1200ms; }
</style>
</head>
<body>
  <div class="screen">
    <div class="progress-dots">
      <span class="active"></span><span></span><span></span>
    </div>

    <div class="content-center">
    <div class="illustration">
      <svg viewBox="0 0 340 280" width="100%" height="100%" class="illustration-svg">
        <!-- Sun -->
        <g transform="translate(170,55)">
          <g class="float">
            <circle r="26" fill="#ffb37a"/>
            <g stroke="#ffb37a" stroke-width="5" stroke-linecap="round">
              <line x1="0" y1="-40" x2="0" y2="-50"/>
              <line x1="0" y1="40" x2="0" y2="50"/>
              <line x1="-40" y1="0" x2="-50" y2="0"/>
              <line x1="40" y1="0" x2="50" y2="0"/>
              <line x1="-28" y1="-28" x2="-35" y2="-35"/>
              <line x1="28" y1="-28" x2="35" y2="-35"/>
              <line x1="-28" y1="28" x2="-35" y2="35"/>
              <line x1="28" y1="28" x2="35" y2="35"/>
            </g>
          </g>
        </g>

        <!-- Clouds -->
        <g transform="translate(55,45)">
          <g class="drift-left">
            <ellipse cy="6" rx="34" ry="15" fill="#fefeff"/>
            <circle cx="-20" cy="-2" r="15" fill="#fefeff"/>
            <circle cx="5" cy="-10" r="18" fill="#fefeff"/>
            <circle cx="27" cy="0" r="13" fill="#fefeff"/>
          </g>
        </g>
        <g transform="translate(275,78)">
          <g class="drift-right">
            <ellipse cy="4" rx="26" ry="11" fill="#fefeff"/>
            <circle cx="-16" cy="-2" r="11" fill="#fefeff"/>
            <circle cx="4" cy="-8" r="14" fill="#fefeff"/>
            <circle cx="22" cy="0" r="9" fill="#fefeff"/>
          </g>
        </g>

        <!-- Café -->
        <g transform="translate(50,172)">
          <g class="float delay-200">
            <path d="M-16,-4 h32 v18 a16,16 0 0 1 -16,16 a16,16 0 0 1 -16,-16 Z" fill="#37323e"/>
            <path d="M16,2 h8 a8,8 0 0 1 0,16 h-6" fill="none" stroke="#37323e" stroke-width="4"/>
            <path d="M-10,-18 q4,-8 0,-14" fill="none" stroke="#6198ff" stroke-width="3" stroke-linecap="round"/>
            <path d="M0,-18 q4,-8 0,-14" fill="none" stroke="#6198ff" stroke-width="3" stroke-linecap="round"/>
          </g>
        </g>

        <!-- Museum -->
        <g transform="translate(122,165)">
          <g class="float delay-600">
            <path d="M-20,10 L0,-4 L20,10 Z" fill="#37323e"/>
            <rect x="-8" y="2" width="16" height="4" fill="#6198ff"/>
            <rect x="-20" y="10" width="40" height="6" fill="#37323e"/>
            <rect x="-15" y="16" width="4" height="14" fill="#37323e"/>
            <rect x="-6" y="16" width="4" height="14" fill="#37323e"/>
            <rect x="3" y="16" width="4" height="14" fill="#37323e"/>
            <rect x="12" y="16" width="4" height="14" fill="#37323e"/>
            <rect x="-20" y="30" width="40" height="4" fill="#37323e"/>
          </g>
        </g>

        <!-- Nature leaf -->
        <g transform="translate(196,170)">
          <g class="float delay-1000">
            <path d="M0,-20 C22,-16 22,14 0,22 C-22,14 -22,-16 0,-20 Z" fill="none" stroke="#37323e" stroke-width="3.5"/>
            <path d="M0,-18 L0,20" stroke="#6198ff" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </g>

        <!-- Fitness -->
        <g transform="translate(266,165)">
          <g class="float delay-400">
            <line x1="-14" y1="0" x2="14" y2="0" stroke="#37323e" stroke-width="5"/>
            <rect x="-22" y="-11" width="9" height="22" rx="3" fill="#37323e"/>
            <rect x="13" y="-11" width="9" height="22" rx="3" fill="#37323e"/>
            <rect x="-3" y="-4" width="6" height="8" fill="#6198ff"/>
          </g>
        </g>

        <!-- Reading -->
        <g transform="translate(84,228)">
          <g class="float delay-800">
            <path d="M-18,-9 C-18,-13 -4,-13 0,-6 C4,-13 18,-13 18,-9 L18,11 C18,7 4,7 0,13 C-4,7 -18,7 -18,11 Z" fill="#37323e"/>
            <rect x="-2.5" y="-16" width="5" height="11" fill="#6198ff"/>
          </g>
        </g>

        <!-- Movies -->
        <g transform="translate(164,225)">
          <g class="float delay-1200">
            <rect x="-18" y="-4" width="36" height="20" rx="2" fill="#37323e"/>
            <path d="M-18,-4 L18,-4 L14,-16 L-22,-16 Z" fill="#37323e"/>
            <line x1="-16" y1="-10" x2="-9" y2="-16" stroke="#6198ff" stroke-width="3.5"/>
            <line x1="-2" y1="-10" x2="5" y2="-16" stroke="#6198ff" stroke-width="3.5"/>
            <line x1="12" y1="-10" x2="19" y2="-16" stroke="#6198ff" stroke-width="3.5"/>
          </g>
        </g>

        <!-- Picnic -->
        <g transform="translate(244,228)">
          <g class="float delay-0">
            <path d="M-18,0 L18,0 L13,18 L-13,18 Z" fill="#37323e"/>
            <path d="M-11,0 Q0,-16 11,0" fill="none" stroke="#37323e" stroke-width="3.5"/>
            <line x1="-12" y1="7" x2="12" y2="7" stroke="#fefeff" stroke-width="1.5"/>
            <line x1="-11" y1="13" x2="11" y2="13" stroke="#fefeff" stroke-width="1.5"/>
            <path d="M-9,0 L9,0 L6,-5 L-6,-5 Z" fill="#6198ff"/>
          </g>
        </g>
      </svg>
    </div>

    <h1 class="title">Welcome to Today</h1>
    <p class="subtitle">Discover experiences you'll actually enjoy in under a minute.</p>
    </div>

    <div class="btn-wrap">
      <button class="btn btn-primary get-started-btn" id="get-started" data-href="onboarding2.html">
        Get Started
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
